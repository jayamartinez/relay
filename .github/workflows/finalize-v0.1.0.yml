name: Finalize Relay v0.1.0

on:
  push:
    branches:
      - chore/finalize-release-v0.1.0
    paths:
      - .github/workflows/finalize-v0.1.0.yml

permissions:
  contents: write

jobs:
  finalize:
    name: Publish Relay v0.1.0
    runs-on: ubuntu-latest
    steps:
      - name: Update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Relay v0.1.0 is the first public release of Relay, an experimental end-to-end encrypted browser workspace sync system originally built for Helium.

          Relay keeps tabs, windows, and supported tab groups synchronized across devices while encrypting workspace state on-device before it reaches the coordination service.

          ## What's included

          - Live synchronization of tabs, windows, and supported tab groups
          - End-to-end encrypted workspace state
          - Device pairing with six-digit SAS verification
          - Offline journaling and reconciliation after reconnecting
          - Device revocation and workspace-key rotation
          - Encrypted local state
          - Cloudflare Workers + Durable Objects backend
          - Self-hosting support

          The release build is configured to use Relay's hosted backend by default.

          ## Installation

          1. Download `relay-extension-v0.1.0.zip` from the assets below.
          2. Extract the ZIP.
          3. Open `helium://extensions` in Helium or `chrome://extensions` in another supported Chromium browser.
          4. Enable **Developer mode**.
          5. Click **Load unpacked**.
          6. Select the extracted Relay folder.

          ## Project status

          Relay is still early and experimental, so bugs should be expected. It has not received an independent security audit and is not currently available through the Chrome Web Store.

          Relay was built for Helium, but it is an independent project and is not affiliated with or endorsed by Helium.

          Source, implementation details, security documentation, and self-hosting instructions are available in the repository:

          https://github.com/jayamartinez/relay
          EOF

          gh release edit v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Relay v0.1.0" \
            --notes-file release-notes.md \
            --prerelease=false \
            --latest
